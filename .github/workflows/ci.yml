name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.2" "uv==0.12.9"
      - run: uv sync --frozen --extra dev --extra report
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: mypy src/oj
      - run: pytest --cov=oj --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
      - run: python scripts/check_coverage.py
      - run: pip-audit --local --skip-editable
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.9
      - run: uv sync --frozen --extra dev
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web

