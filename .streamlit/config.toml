[theme]
base = "light"
primaryColor = "#3563E9"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#182B45"
font = "sans-serif"
baseFontSize = 16
baseRadius = "0.625rem"
borderColor = "#E2E8F2"
headingFontSizes = ["2rem", "1.5rem", "1.125rem"]
codeFontSize = "0.875rem"

[theme.sidebar]
backgroundColor = "#14243A"
secondaryBackgroundColor = "#223953"
textColor = "#F3F6FC"
primaryColor = "#9EBBFF"

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
headless = true
